name: Release Client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: pan-vlessbank-client_linux_amd64
          - goos: linux
            goarch: arm64
            asset: pan-vlessbank-client_linux_arm64
          - goos: darwin
            goarch: amd64
            asset: pan-vlessbank-client_darwin_amd64
          - goos: darwin
            goarch: arm64
            asset: pan-vlessbank-client_darwin_arm64
          - goos: windows
            goarch: amd64
            asset: pan-vlessbank-client_windows_amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags='-s -w' -o dist/${{ matrix.asset }} ./cmd/pan-vlessbank-client
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && sha256sum pan-vlessbank-client* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/* --title "Pan-VlessBank Client ${{ github.ref_name }}" --generate-notes
